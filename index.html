<script>
// ===== FIREBASE INITIALIZATION =====
const firebaseConfig = {
  apiKey: "AIzaSyCEpWJtYwHeei3wgtv4d_yfTfKvE_EaeS8",
  authDomain: "wallet-8a2ce.firebaseapp.com",
  projectId: "wallet-8a2ce",
  storageBucket: "wallet-8a2ce.firebasestorage.app",
  messagingSenderId: "411590071354",
  appId: "1:411590071354:web:7515fde5f16430d9895103",
  measurementId: "G-081BQGRF1H"
};

firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.firestore();

// ===== STATE =====
let currentUser = null;
let currentWalletId = null;

// Listen for Firebase Auth State Changes
auth.onAuthStateChanged((user) => {
  if (user) {
    currentUser = user.uid;
    showDashboard();
  } else {
    currentUser = null;
    showScreen("authScreen");
  }
});

// ===== CLOUD STORAGE HELPERS (FIRESTORE) =====
async function getWallets() {
  if (!currentUser) return [];
  let snapshot = await db.collection("users").doc(currentUser).collection("wallets").get();
  let wallets = [];
  snapshot.forEach(doc => {
    wallets.push({ id: doc.id, ...doc.data() });
  });
  return wallets;
}

async function saveWalletToCloud(wallet) {
  if (!currentUser) return;
  await db.collection("users").doc(currentUser).collection("wallets").doc(wallet.id).set(wallet);
}

async function getWallet(id) {
  if (!currentUser || !id) return null;
  let doc = await db.collection("users").doc(currentUser).collection("wallets").doc(id).get();
  if (doc.exists) {
    return { id: doc.id, ...doc.data() };
  }
  return null;
}

async function deleteWalletFromCloud() {
  if (!currentUser || !currentWalletId) return;
  if (!confirm("Are you sure you want to delete this wallet and all its transactions?")) return;

  let activeId = currentWalletId;
  await db.collection("users").doc(currentUser).collection("wallets").doc(activeId).delete();
  currentWalletId = null;
  showDashboard();
}

// ===== AUTH (FIREBASE) =====
function register() {
  let username = document.getElementById("regUsername").value.trim().toLowerCase();
  let pin = document.getElementById("regPin").value;
  let errEl = document.getElementById("regError");
  errEl.innerText = "";

  if (!username) { errEl.innerText = "Please enter a username."; return; }
  if (!/^\d{6}$/.test(pin)) { errEl.innerText = "PIN must be exactly 6 digits."; return; }

  let email = username + "@mywallet.app";

  auth.createUserWithEmailAndPassword(email, pin)
    .catch((error) => {
      errEl.innerText = error.message;
    });
}

function login() {
  let username = document.getElementById("loginUsername").value.trim().toLowerCase();
  let pin = document.getElementById("loginPin").value;
  let errEl = document.getElementById("loginError");
  errEl.innerText = "";

  let email = username + "@mywallet.app";

  auth.signInWithEmailAndPassword(email, pin)
    .catch((error) => {
      errEl.innerText = "Incorrect username or PIN.";
    });
}

function logout() {
  auth.signOut().then(() => {
    currentWalletId = null;
    document.getElementById("loginUsername").value = "";
    document.getElementById("loginPin").value = "";
  });
}

function showLogin() {
  document.getElementById("registerForm").style.display = "none";
  document.getElementById("loginForm").style.display = "block";
}

function showRegister() {
  document.getElementById("loginForm").style.display = "none";
  document.getElementById("registerForm").style.display = "block";
}

// ===== NAVIGATION =====
function showScreen(id) {
  ["authScreen", "dashboard", "walletDetail"].forEach(s => {
    document.getElementById(s).style.display = "none";
  });
  document.getElementById(id).style.display = id === "authScreen" ? "flex" : "block";
  document.getElementById("fab").style.display = (id === "dashboard") ? "block" : "none";
}

function showDashboard() {
  showScreen("dashboard");
  renderDashboard();
}

async function showWalletDetail(id) {
  currentWalletId = id;
  showScreen("walletDetail");
  let wallet = await getWallet(id);
  if (wallet) {
    document.getElementById("walletName").innerText = wallet.name;
    renderWalletDetail(wallet);
  }
}

// ===== DASHBOARD RENDER =====
async function renderDashboard() {
  let wallets = await getWallets();
  let grid = document.getElementById("walletGrid");
  let emptyDash = document.getElementById("emptyDash");
  grid.innerHTML = "";

  if (wallets.length === 0) {
    emptyDash.style.display = "block";
  } else {
    emptyDash.style.display = "none";
  }

  let total = 0;
  wallets.forEach(w => {
    total += w.balance;
    let card = document.createElement("div");
    card.className = "wallet-card";
    card.onclick = () => showWalletDetail(w.id);

    card.innerHTML = `
      <div class="w-name">${w.name}</div>
      <div class="w-balance">₹${w.balance.toLocaleString("en-IN")}</div>
      <div class="w-tx-count">${w.transactions.length} transaction${w.transactions.length !== 1 ? "s" : ""}</div>
    `;
    grid.appendChild(card);
  });

  document.getElementById("totalBalance").innerText = "₹" + total.toLocaleString("en-IN");
}

// ===== WALLET DETAIL RENDER =====
async function renderWalletDetail(walletArg) {
  let wallet = walletArg || await getWallet(currentWalletId);
  if (!wallet) return;

  document.getElementById("balance").innerText = "₹" + wallet.balance.toLocaleString("en-IN");

  let list = document.getElementById("transactionList");
  list.innerHTML = "";

  if (!wallet.transactions || wallet.transactions.length === 0) {
    list.innerHTML = '<div class="empty">No transactions yet</div>';
    return;
  }

  wallet.transactions.slice().reverse().forEach(tx => {
    let row = document.createElement("div");
    row.className = "transaction";

    let infoDiv = document.createElement("div");
    infoDiv.className = "transaction-info";

    let noteSpan = document.createElement("span");
    noteSpan.className = "transaction-note";
    noteSpan.innerText = tx.note;

    let typeSpan = document.createElement("span");
    typeSpan.className = "transaction-type";
    typeSpan.innerText = tx.type === "add" ? "Added" : "Spent";

    let timeSpan = document.createElement("span");
    timeSpan.className = "transaction-time";
    if (tx.timestamp) {
      timeSpan.innerText = new Date(tx.timestamp).toLocaleString("en-IN", {
        day: "2-digit", month: "short", year: "numeric",
        hour: "2-digit", minute: "2-digit"
      });
    }

    infoDiv.appendChild(noteSpan);
    infoDiv.appendChild(typeSpan);
    infoDiv.appendChild(timeSpan);

    let rightDiv = document.createElement("div");
    rightDiv.className = "tx-right";

    let amountSpan = document.createElement("span");
    amountSpan.innerText = tx.sign + " ₹" + tx.amount.toLocaleString("en-IN");
    amountSpan.className = tx.type === "add" ? "added" : "spent";

    let actionsDiv = document.createElement("div");
    actionsDiv.className = "tx-actions";

    let editBtn = document.createElement("button");
    editBtn.className = "tx-btn";
    editBtn.innerText = "Edit";
    editBtn.onclick = () => editTransaction(tx.id);

    let deleteBtn = document.createElement("button");
    deleteBtn.className = "tx-btn tx-delete-btn";
    deleteBtn.innerText = "✕";
    deleteBtn.onclick = () => deleteTransaction(tx.id);

    actionsDiv.appendChild(editBtn);
    actionsDiv.appendChild(deleteBtn);

    rightDiv.appendChild(amountSpan);
    rightDiv.appendChild(actionsDiv);

    row.appendChild(infoDiv);
    row.appendChild(rightDiv);
    list.appendChild(row);
  });
}

// ===== ADD / SPEND / EDIT / DELETE TRANSACTIONS =====
async function addMoney() {
  let amount = Number(document.getElementById("amount").value);
  let note = document.getElementById("note").value.trim();

  if (!amount || amount <= 0) { alert("Please enter a valid amount."); return; }
  if (!note) { alert("Please enter a note."); return; }

  let activeWalletId = currentWalletId;
  let wallet = await getWallet(activeWalletId);
  if (!wallet) return;
  if (!wallet.transactions) wallet.transactions = [];

  wallet.balance += amount;
  wallet.transactions.push({ 
    id: Date.now().toString() + Math.random().toString(36).substring(2,5), 
    type: "add", 
    note, 
    amount, 
    sign: "+", 
    timestamp: Date.now() 
  });
  await saveWalletToCloud(wallet);

  document.getElementById("amount").value = "";
  document.getElementById("note").value = "";
  renderWalletDetail(wallet);
}

async function spendMoney() {
  let amount = Number(document.getElementById("amount").value);
  let note = document.getElementById("note").value.trim();

  if (!amount || amount <= 0) { alert("Please enter a valid amount."); return; }
  if (!note) { alert("Please enter a note."); return; }

  let activeWalletId = currentWalletId;
  let wallet = await getWallet(activeWalletId);
  if (!wallet) return;
  if (!wallet.transactions) wallet.transactions = [];

  wallet.balance -= amount;
  wallet.transactions.push({ 
    id: Date.now().toString() + Math.random().toString(36).substring(2,5), 
    type: "spend", 
    note, 
    amount, 
    sign: "-", 
    timestamp: Date.now() 
  });
  await saveWalletToCloud(wallet);

  document.getElementById("amount").value = "";
  document.getElementById("note").value = "";
  renderWalletDetail(wallet);
}

async function editTransaction(txId) {
  let activeWalletId = currentWalletId;
  if (!activeWalletId) {
    alert("No active wallet selected.");
    return;
  }

  let wallet = await getWallet(activeWalletId);
  if (!wallet || !wallet.transactions) {
    alert("Wallet not found.");
    return;
  }

  let tx = wallet.transactions.find(t => t.id === txId);
  if (!tx) return;

  let newNote = prompt("Edit transaction note:", tx.note);
  if (newNote === null) return; 
  newNote = newNote.trim();
  if (!newNote) { alert("Note cannot be empty."); return; }

  let newAmountStr = prompt("Edit transaction amount:", tx.amount);
  if (newAmountStr === null) return;
  let newAmount = Number(newAmountStr);
  if (!newAmount || newAmount <= 0) { alert("Please enter a valid amount."); return; }

  tx.note = newNote;
  tx.amount = newAmount;

  let computedBalance = 0;
  wallet.transactions.forEach(t => {
    if (t.type === "add") computedBalance += t.amount;
    if (t.type === "spend") computedBalance -= t.amount;
  });
  wallet.balance = computedBalance;

  currentWalletId = activeWalletId; // Ensure context remains locked
  await saveWalletToCloud(wallet);
  renderWalletDetail(wallet);
  renderDashboard();
}

async function deleteTransaction(txId) {
  if (!confirm("Are you sure you want to delete this transaction?")) return;

  let activeWalletId = currentWalletId;
  let wallet = await getWallet(activeWalletId);
  if (!wallet) return;
  
  wallet.transactions = wallet.transactions.filter(t => t.id !== txId);

  let computedBalance = 0;
  wallet.transactions.forEach(t => {
    if (t.type === "add") computedBalance += t.amount;
    if (t.type === "spend") computedBalance -= t.amount;
  });
  wallet.balance = computedBalance;

  currentWalletId = activeWalletId;
  await saveWalletToCloud(wallet);
  renderWalletDetail(wallet);
  renderDashboard();
}

// ===== CREATE WALLET (FAB + MODAL) =====
function openNewWalletModal() {
  document.getElementById("newWalletName").value = "";
  document.getElementById("modalOverlay").style.display = "flex";
  document.getElementById("newWalletName").focus();
}

function closeModal() {
  document.getElementById("modalOverlay").style.display = "none";
}

async function createWallet() {
  let name = document.getElementById("newWalletName").value.trim();
  if (!name) { alert("Please enter a wallet name."); return; }

  let newWallet = {
    id: Date.now().toString(),
    name: name,
    balance: 0,
    transactions: []
  };

  await saveWalletToCloud(newWallet);
  closeModal();
  renderDashboard();
}

document.getElementById("modalOverlay").addEventListener("click", function(e) {
  if (e.target === this) closeModal();
});

// ===== EVENT LISTENERS =====
document.getElementById("regBtn").addEventListener("click", register);
document.getElementById("loginBtn").addEventListener("click", login);
document.getElementById("logoutBtn").addEventListener("click", logout);
document.getElementById("showLoginLink").addEventListener("click", showLogin);
document.getElementById("showRegisterLink").addEventListener("click", showRegister);
document.getElementById("backBtn").addEventListener("click", showDashboard);
document.getElementById("deleteWalletBtn").addEventListener("click", deleteWalletFromCloud);
document.getElementById("addMoneyBtn").addEventListener("click", addMoney);
document.getElementById("spendMoneyBtn").addEventListener("click", spendMoney);
document.getElementById("fab").addEventListener("click", openNewWalletModal);
document.getElementById("cancelModalBtn").addEventListener("click", closeModal);
document.getElementById("confirmModalBtn").addEventListener("click", createWallet);
</script>
